packages:
  - "viewer"
  - "engine"
# pnpm 11 (resolved via corepack in CI) blocks dependency postinstall scripts by default.
# These are all no-op or cosmetic (core-js/ejs banners, an optional native watcher);
# allow them so `pnpm install` exits 0.
allowBuilds:
  "@parcel/watcher": true
  bootstrap-vue: true
  core-js: true
  core-js-pure: true
  ejs: true
  esbuild: true
  nodent-runtime: true
  yorkie: true
