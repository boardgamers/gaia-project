packages:
  - "viewer"
  - "engine"
  - "old-ui"
# pnpm 11 (resolved via corepack in CI) blocks dependency postinstall scripts by default.
# Allow the existing dependency setup scripts and Sharp's native-library check
# (used by the local achievement-portrait generator) so `pnpm install` exits 0.
allowBuilds:
  "@parcel/watcher": true
  bootstrap-vue: true
  core-js: true
  core-js-pure: true
  ejs: true
  esbuild: true
  nodent-runtime: true
  sharp: true
  yorkie: true
minimumReleaseAgeExclude:
  - "@boardgamers/protocol@0.2.2 || 0.3.3 || 0.3.4 || 0.4.0 || 0.4.2 || 0.5.0 || 0.6.0 || 0.6.1 || 0.6.2 || 0.8.1 || 0.10.0 || 0.11.0"
