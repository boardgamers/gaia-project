name: Viewer - Test
on:
  push:
    paths:
      - ".github/workflows/viewer-test.yml"
      - "engine/**"
      - "viewer/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
    branches:
      - master
  pull_request:
    paths:
      - ".github/workflows/viewer-test.yml"
      - "engine/**"
      - "viewer/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"

concurrency:
  group: viewer-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test_and_build:
    runs-on: ubuntu-latest
    env:
      # mochapack bundles every spec plus the engine into one webpack build,
      # which needs more than the runner's ~2 GB default heap.
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @gaia-project/engine build
      - run: pnpm --filter @gaia-project/viewer test -- --reporter min
      - run: pnpm --filter @gaia-project/viewer build
