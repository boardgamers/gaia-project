name: Old UI - Test
on:
  push:
    paths:
      - ".github/workflows/old-ui-test.yml"
      - "old-ui/**"
    branches:
      - master
  pull_request:
    paths:
      - ".github/workflows/old-ui-test.yml"
      - "old-ui/**"

concurrency:
  group: old-ui-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test_and_build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @gaia-project/old-ui lint
      # No build step: old-ui is unmaintained and no longer compiles against the current engine
      # (its factionData is missing the four Lost Fleet factions, and a couple of call sites still
      # use pre-Lost-Fleet signatures). Nothing deploys it - vercel.json builds the viewer only.
      # Restore this step if old-ui is ever brought back up to date:
      #   - run: pnpm --filter @gaia-project/old-ui build
