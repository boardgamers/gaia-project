name: Old UI - Test
on:
  push:
    paths:
      - ".github/workflows/old-ui-test.yml"
      - "viewer/**"
    branches:
      - master
  pull_request:
    paths:
      - ".github/workflows/old-ui-test.yml"
      - "viewer/**"

defaults:
  run:
    working-directory: old-ui

jobs:
  test_and_build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: corepack enable
      - run: pnpm install
      - run: pnpm lint
      # - run: pnpm test
      - run: pnpm build
